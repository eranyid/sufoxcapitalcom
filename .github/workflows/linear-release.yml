# Report merged commits to Linear as a continuous release.
# Requires: LINEAR_ACCESS_KEY + LINEAR_QA_ACCESS_KEY secrets.
# Docs: https://github.com/linear/linear-release-action
# Pipelines: Backend Production, QA Candidate

name: Linear Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linear-release:
    name: Report Release to Linear
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync release – Backend Production
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}

      - name: Sync release – QA Candidate
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_QA_ACCESS_KEY }}
