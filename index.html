<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    
    <!-- Preconnect to external origins for faster resource loading -->
    <link rel="preconnect" href="https://tibawkrjihvibckxutvj.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://tibawkrjihvibckxutvj.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical fonts for faster LCP -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" as="style" />
    
    <!-- Modulepreload for critical JS to improve LCP -->
    <link rel="modulepreload" href="/src/main.tsx" />
    
    <title>SUFOX Capital | Investment Portfolio Dashboard</title>
    <meta name="description" content="Professional hedge fund investment dashboard for tracking portfolio performance, risk metrics, and asset allocation with institutional-grade analytics.">
    <meta name="author" content="SUFOX Capital" />
    <meta name="keywords" content="investment dashboard, portfolio management, hedge fund, risk analytics, performance tracking">

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SUFOX Capital" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111111" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    
    <!-- Splash Screens for iOS -->
    <link rel="apple-touch-startup-image" href="/splash-screen.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/8GMW3eZiSSZUUkGmDMqDHdTSB3g1/social-images/social-1764874171432-Ingoude.png">
    <meta property="og:title" content="SUFOX Capital | Investment Portfolio Dashboard">
    <meta property="og:description" content="Professional hedge fund investment dashboard for tracking portfolio performance, risk metrics, and asset allocation with institutional-grade analytics.">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@sufoxcapital" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/8GMW3eZiSSZUUkGmDMqDHdTSB3g1/social-images/social-1764874171432-Ingoude.png">
    <meta name="twitter:title" content="SUFOX Capital | Investment Portfolio Dashboard">
    <meta name="twitter:description" content="Professional hedge fund investment dashboard for tracking portfolio performance, risk metrics, and asset allocation with institutional-grade analytics.">
    
    <link rel="icon" type="image/x-icon" href="https://storage.googleapis.com/gpt-engineer-file-uploads/8GMW3eZiSSZUUkGmDMqDHdTSB3g1/uploads/1764875087655-logo light black beakround.png">
    
    <!-- Critical inline CSS for faster FCP -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
      body{font-family:system-ui,-apple-system,sans-serif;background:#0B0E11;color:#E8EAED;min-height:100vh;min-height:100dvh}
      #root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
      .initial-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B0E11;z-index:9999}
      .initial-loader-spinner{width:40px;height:40px;border:3px solid #1a1f24;border-top-color:#F97316;border-radius:50%;animation:spin 1s linear infinite}
      .initial-loader-text{margin-top:16px;color:#9CA3AF;font-size:14px;letter-spacing:0.05em}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>

  <body>
    <div id="root">
      <div class="initial-loader" id="initial-loader">
        <div class="initial-loader-spinner"></div>
        <div class="initial-loader-text">SUFOX CAPITAL</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove initial loader once React mounts
      window.addEventListener('DOMContentLoaded', function() {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          setTimeout(function() { loader.style.display = 'none'; }, 100);
        }
      });
    </script>
  </body>
</html>
